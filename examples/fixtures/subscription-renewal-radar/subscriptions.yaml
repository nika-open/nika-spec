# Invented subscriptions of an invented studio (Quarry Lane Studio). Every
# vendor, plan, amount and date is fictional. Amounts are quoted strings
# with two decimals: unquoted, YAML reads 96.10 as a float and the cents
# are lost, so the radar's schema refuses a bare number.
#
# `renewal_date` is the next charge date; for a trial it is the day the trial
# turns into a paid plan. `notice_days` is the cancellation notice the
# contract asks for. `usage_signal: none` means no sign-in data exists for
# the tool, so the radar cannot judge its seats.
registry: saas-subscriptions
company: Quarry Lane Studio
subscriptions:
  - id: quillnote-docs
    vendor: Quillnote Docs
    plan: Team
    category: operations
    status: active
    cycle: monthly
    amount: "96.00"
    currency: EUR
    seats: 12
    renewal_date: "2026-11-29"
    notice_days: 0
    owner: ops
    usage_signal: sso
